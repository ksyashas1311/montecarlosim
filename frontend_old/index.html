<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FinTwin — Your Financial Future, Simulated</title>
    
    <!-- External assets matching the design spec -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-background": "#dee3ea",
                        "on-primary-container": "#006c71",
                        "primary-fixed-dim": "#00dce5",
                        "on-primary-fixed": "#002021",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "surface-bright": "#353a3f",
                        "surface-container-highest": "#30353b",
                        "background": "#0f1419",
                        "surface-variant": "#30353b",
                        "primary": "#e9feff",
                        "on-tertiary": "#412d00",
                        "inverse-primary": "#00696e",
                        "on-secondary-fixed-variant": "#5700c9",
                        "secondary": "#d1bcff",
                        "on-surface-variant": "#b9caca",
                        "surface-dim": "#0f1419",
                        "tertiary-container": "#ffd895",
                        "on-surface": "#dee3ea",
                        "inverse-on-surface": "#2c3137",
                        "surface-container-low": "#171c21",
                        "on-primary": "#003739",
                        "on-primary-fixed-variant": "#004f53",
                        "on-secondary-container": "#ddcdff",
                        "outline": "#849495",
                        "on-secondary": "#3c0090",
                        "tertiary-fixed": "#ffdea8",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "surface-container-high": "#252a30",
                        "secondary-fixed": "#e9ddff",
                        "tertiary-fixed-dim": "#ffba20",
                        "tertiary": "#fff9f5",
                        "on-tertiary-container": "#805b00",
                        "secondary-fixed-dim": "#d1bcff",
                        "surface-tint": "#00dce5",
                        "surface-container": "#1b2025",
                        "surface": "#0f1419",
                        "error-container": "#93000a",
                        "secondary-container": "#7000ff",
                        "on-tertiary-fixed": "#271900",
                        "primary-fixed": "#63f7ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "gutter": "24px",
                        "container-max": "1440px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "mono-data-sm": ["JetBrains Mono"],
                        "display-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "mono-data-lg": ["JetBrains Mono"]
                    }
                }
            }
        };
    </script>
    <style>
        @layer base {
            html, body {
                margin: 0;
                padding: 0;
                background-color: #0f1419;
            }
            ::-webkit-scrollbar {
                display: none;
            }
        }
        .glow-ambient {
            box-shadow: 0 0 40px 10px rgba(0, 220, 229, 0.05);
        }
        .glass-card {
            background: rgba(22, 28, 36, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col">

    <!-- Landing View -->
    <div id="landing-view" class="w-full min-h-screen flex items-center justify-center relative bg-surface-container-lowest overflow-hidden z-50">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-[60vw] h-[60vw] max-w-[800px] max-h-[800px] rounded-full bg-[radial-gradient(circle_at_center,rgba(0,245,255,0.08)_0%,rgba(112,0,255,0.03)_40%,transparent_70%)] animate-pulse"></div>
        </div>
        <div class="z-10 flex flex-col items-center justify-center gap-12 text-center p-gutter glass-card rounded-2xl relative overflow-hidden group hover:glow-ambient transition-shadow duration-700 ease-in-out">
            <div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[linear-gradient(rgba(255,255,255,1)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,1)_1px,transparent_1px)] bg-[size:24px_24px]"></div>
            <div class="flex flex-col items-center gap-6">
                <h1 class="font-display-lg text-[64px] text-on-surface tracking-tighter drop-shadow-[0_0_15px_rgba(0,245,255,0.3)] select-none">
                    <span class="text-surface-tint opacity-80 mr-2">></span>FinTwin
                </h1>
                <p class="font-mono-data-sm text-mono-data-sm text-on-surface-variant tracking-[0.2em] uppercase opacity-70">
                    Personal Financial Digital Twin
                </p>
            </div>
            <button class="group/btn relative px-8 py-4 bg-secondary-container/90 hover:bg-secondary-container text-on-secondary-container font-label-caps text-label-caps rounded-xl transition-all duration-300 ease-out transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(112,0,255,0.2)]" id="enter-btn">
                ENTER FINTWIN
            </button>
            <div class="flex items-center gap-2 mt-4 opacity-50">
                <div class="w-2 h-2 rounded-full bg-surface-tint shadow-[0_0_8px_rgba(0,220,229,0.8)] animate-pulse"></div>
                <span class="font-mono-data-sm text-[10px] text-on-surface tracking-widest uppercase">System Online</span>
            </div>
        </div>
    </div>

    <!-- Main Workspace View (Initially Hidden) -->
    <div id="workspace-view" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="fixed top-0 w-full h-16 z-50 bg-surface-container/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.1)] border-b border-outline-variant/10">
            <div class="h-16 w-full px-gutter flex items-center justify-between">
                <div class="flex items-center gap-4 cursor-pointer" onclick="navigateTo('dashboard')">
                    <span class="font-display-lg text-headline-md tracking-tighter text-on-surface flex items-center gap-2">
                        <span class="text-surface-tint opacity-80 font-mono-data-sm">></span>FinTwin
                    </span>
                </div>
                <nav class="hidden lg:flex items-center gap-8">
                    <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="text-label-caps font-label-caps text-primary-fixed-dim font-bold underline decoration-2 underline-offset-8">Dashboard</button>
                    <button onclick="navigateTo('simulation-lab')" id="nav-simulation-lab" class="text-label-caps font-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Simulation Lab</button>
                    <button onclick="navigateTo('life-events')" id="nav-life-events" class="text-label-caps font-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Life Events</button>
                    <button onclick="navigateTo('asset-allocation')" id="nav-asset-allocation" class="text-label-caps font-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Assets & Liabilities</button>
                    <button onclick="navigateTo('ai-copilot')" id="nav-ai-copilot" class="text-label-caps font-label-caps text-on-surface-variant hover:text-on-surface transition-colors">AI Copilot</button>
                </nav>
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-72 bg-surface-container-low z-40 p-gutter flex flex-col gap-8 border-r border-outline-variant/10 overflow-y-auto">
            <div class="space-y-6">
                <div class="p-4 bg-surface-container-highest/50 rounded-xl border border-outline-variant/20 backdrop-blur-md shadow-inner">
                    <h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Digital Twin State</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-mono-data-sm font-mono-data-sm text-on-surface-variant">Current Age</span>
                            <span id="side-current-age" class="text-mono-data-lg font-mono-data-lg text-primary-fixed-dim">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-mono-data-sm font-mono-data-sm text-on-surface-variant">Retirement Age</span>
                            <span id="side-ret-age" class="text-mono-data-lg font-mono-data-lg text-on-surface">-</span>
                        </div>
                        <div class="pt-4 border-t border-outline-variant/20 text-center">
                            <span class="text-label-caps font-label-caps text-on-surface-variant block mb-1 uppercase">Goal Success Rate</span>
                            <div id="side-success-probability" class="text-display-lg font-display-lg text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,220,229,0.4)]">-</div>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-surface-container-highest/30 rounded-xl border border-outline-variant/20 space-y-2">
                    <h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">Sim telemetry</h3>
                    <div class="font-mono-data-sm text-[12px] text-on-surface-variant space-y-1">
                        <div>&gt; Model: Vectorized MCQ</div>
                        <div id="telemetry-runs">&gt; Simulations: 10,000</div>
                        <div id="telemetry-status">&gt; Engine: Stable</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="pl-72 flex-1 flex flex-col">
            <main id="main-content" class="pt-16 min-h-[calc(100vh-64px-48px)] bg-surface text-on-surface relative flex flex-col">
                <!-- Inner page content injected dynamically -->
            </main>
            
            <footer class="w-full bg-surface-container-lowest py-4 px-gutter border-t border-outline-variant/10 text-on-surface-variant z-10">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-4 text-mono-data-sm font-mono-data-sm">
                        <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-primary-fixed-dim animate-pulse"></span> Simulations active</span>
                    </div>
                    <div class="text-label-caps font-label-caps text-[10px] text-on-surface-variant/60 uppercase">FinTwin Educational Risk Engine Dashboard</div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let userId = 1; // Default bootstrap user ID
        let appState = {
            profile: null,
            assets: [],
            goals: [],
            lifeEvents: [],
            liabilities: [],
            simulation: null,
            activePath: 'dashboard',
            marketModel: 'parametric',
            decumulationStrategy: 'inflation_adjusted'
        };

        // Bootstrap: check if user exists, otherwise create
        async function initApp() {
            try {
                const res = await fetch(`${API_BASE}/users/${userId}`);
                if (res.status === 404) {
                    // Create Default User
                    const defaultUser = {
                        name: "Arjun Kumar",
                        profile: {
                            current_age: 21,
                            monthly_income: 60000,
                            monthly_expenses: 30000,
                            monthly_sip: 15000,
                            current_wealth: 150000
                        },
                        assets: [
                            {name: "Equity", weight: 0.60, expected_return: 0.12, volatility: 0.18},
                            {name: "Debt", weight: 0.25, expected_return: 0.07, volatility: 0.05},
                            {name: "Gold", weight: 0.10, expected_return: 0.08, volatility: 0.15},
                            {name: "Cash", weight: 0.05, expected_return: 0.04, volatility: 0.01}
                        ],
                        goals: [
                            {name: "Retirement corpus", target_amount: 15000000, target_age: 50}
                        ],
                        life_events: [
                            {name: "Buy Car", type: "lump_sum_expense", age: 25, amount: 400000}
                        ],
                        liabilities: []
                    };
                    const createRes = await fetch(`${API_BASE}/users`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(defaultUser)
                    });
                    const userData = await createRes.json();
                    userId = userData.id;
                }
                
                await refreshData();
            } catch (err) {
                console.error("Initialization failed. API might be offline: ", err);
            }
        }

        async function refreshData() {
            try {
                const res = await fetch(`${API_BASE}/users/${userId}`);
                const data = await res.json();
                appState.profile = data.profile;
                appState.assets = data.assets;
                appState.goals = data.goals;
                appState.lifeEvents = data.life_events;
                appState.liabilities = data.liabilities || [];

                // Run Simulation
                const simRes = await fetch(`${API_BASE}/users/${userId}/simulate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        n_simulations: 2000,
                        horizon_years: 40,
                        market_model: appState.marketModel,
                        decumulation_strategy: appState.decumulationStrategy
                    })
                });
                appState.simulation = await simRes.json();

                updateSidebar();
                renderPage();
            } catch (err) {
                console.error("Error refreshing application data: ", err);
            }
        }

        function updateSidebar() {
            if (!appState.profile) return;
            document.getElementById('side-current-age').innerText = appState.profile.current_age;
            
            const mainGoal = appState.goals[0];
            if (mainGoal) {
                document.getElementById('side-ret-age').innerText = mainGoal.target_age;
            }
            
            if (appState.simulation && appState.simulation.goals.length > 0) {
                const prob = appState.simulation.goals[0].success_probability;
                document.getElementById('side-success-probability').innerText = `${(prob * 100).toFixed(0)}%`;
            }
            if (appState.simulation) {
                document.getElementById('telemetry-runs').innerText = `> Simulations: ${appState.simulation.n_simulations.toLocaleString()}`;
            }
        }

        // Router
        function navigateTo(path) {
            appState.activePath = path;
            
            // Toggle active classes on header links
            const links = ['dashboard', 'simulation-lab', 'life-events', 'asset-allocation', 'ai-copilot'];
            links.forEach(l => {
                const elem = document.getElementById(`nav-${l}`);
                if (elem) {
                    if (l === path) {
                        elem.className = "text-label-caps font-label-caps text-primary-fixed-dim font-bold underline decoration-2 underline-offset-8";
                    } else {
                        elem.className = "text-label-caps font-label-caps text-on-surface-variant hover:text-on-surface transition-colors";
                    }
                }
            });

            renderPage();
        }

        function renderPage() {
            const main = document.getElementById('main-content');
            main.innerHTML = ""; // Clear active content

            if (appState.activePath === 'dashboard') {
                renderDashboard(main);
            } else if (appState.activePath === 'simulation-lab') {
                renderSimulationLab(main);
            } else if (appState.activePath === 'life-events') {
                renderLifeEvents(main);
            } else if (appState.activePath === 'asset-allocation') {
                renderAssetAllocation(main);
            } else if (appState.activePath === 'ai-copilot') {
                renderAICopilot(main);
            }
        }

        // --- DASHBOARD PAGE ---
        function renderDashboard(container) {
            const healthScore = appState.simulation ? Math.round(appState.simulation.goals[0].success_probability * 100) : 75;
            const terminalWealth = appState.simulation ? appState.simulation.terminal_wealth_median : 0;
            const primaryGoal = appState.goals[0] || { name: "Retirement", target_amount: 15000000, target_age: 50 };
            
            // Build Dynamic Future Cone SVG
            let svgPaths = "";
            if (appState.simulation) {
                const samplePaths = appState.simulation.wealth_paths_sample;
                const p50 = appState.simulation.percentiles.p50;
                const p5 = appState.simulation.percentiles.p5;
                const p95 = appState.simulation.percentiles.p95;
                
                const width = 800;
                const height = 350;
                const nPoints = p50.length;
                const maxVal = Math.max(...p95) * 1.1;

                // Function to build SVG path
                const buildPath = (data) => {
                    return data.map((val, idx) => {
                        const x = (idx / (nPoints - 1)) * width;
                        const y = height - (val / maxVal) * height;
                        return `${idx === 0 ? 'M' : 'L'} ${x},${y}`;
                    }).join(' ');
                };

                // Cone shade
                const topPath = p95.map((val, idx) => `${(idx / (nPoints - 1)) * width},${height - (val / maxVal) * height}`);
                const bottomPath = p5.map((val, idx) => `${(idx / (nPoints - 1)) * width},${height - (val / maxVal) * height}`).reverse();
                const coneD = `M ${topPath.join(' L ')} L ${bottomPath.join(' L ')} Z`;

                svgPaths = `
                    <path d="${coneD}" fill="url(#cone-grad)" opacity="0.15"></path>
                    <path d="${buildPath(p50)}" stroke="#00dce5" stroke-width="3" fill="none"></path>
                    <path d="${buildPath(p95)}" stroke="#d1bcff" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6"></path>
                    <path d="${buildPath(p5)}" stroke="#ffb4ab" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6"></path>
                `;
            }

            container.innerHTML = `
                <div class="flex flex-col w-full">
                    <!-- Future Cone Hero -->
                    <section class="relative w-full h-[400px] bg-surface-container-lowest overflow-hidden flex flex-col p-8 shadow-2xl rounded-b-2xl mb-8 justify-start">
                        <div class="absolute inset-0 z-0">
                            <svg class="w-full h-full" fill="none" preserveAspectRatio="none" viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="cone-grad" x1="0" x2="0" y1="0" y2="1">
                                        <stop offset="0%" stop-color="#00dce5" stop-opacity="0.8"></stop>
                                        <stop offset="100%" stop-color="#0f1419" stop-opacity="0"></stop>
                                    </linearGradient>
                                </defs>
                                ${svgPaths}
                            </svg>
                        </div>
                        <div class="relative z-10 w-full max-w-container-max mx-auto flex justify-between items-end mt-auto">
                            <div>
                                <h1 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest mb-2">Net Worth Trajectory</h1>
                                <div class="text-[32px] font-display-lg text-on-surface">The Future Cone</div>
                            </div>
                            <div class="text-right">
                                <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-1">Projected Median Value</div>
                                <div class="text-headline-md font-headline-md text-primary-fixed-dim font-mono-data-lg">₹ ${(terminalWealth/10000000).toFixed(2)} CR</div>
                            </div>
                        </div>
                    </section>

                    <!-- Info Cards Grid -->
                    <div class="w-full max-w-container-max mx-auto px-8 pb-8 grid grid-cols-1 md:grid-cols-5 gap-6">
                        <div class="bg-surface-container/60 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-outline-variant/10 flex flex-col justify-between">
                            <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">Financial Health</div>
                            <div class="text-headline-md font-bold text-primary-fixed-dim font-mono-data-lg">${healthScore}/100</div>
                        </div>
                        <div class="bg-surface-container/60 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-outline-variant/10 flex flex-col justify-between">
                            <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">Starting Wealth</div>
                            <div class="text-headline-md font-mono-data-lg text-on-surface">₹ ${appState.profile.current_wealth.toLocaleString()}</div>
                        </div>
                        <div class="bg-surface-container/60 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-outline-variant/10 flex flex-col justify-between">
                            <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">Monthly Investment</div>
                            <div class="text-headline-md font-mono-data-lg text-on-surface">₹ ${appState.profile.monthly_sip.toLocaleString()}</div>
                        </div>
                        <div class="bg-surface-container/60 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-outline-variant/10 flex flex-col justify-between">
                            <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">Outstanding Debt</div>
                            <div class="text-headline-md font-mono-data-lg ${appState.liabilities.length > 0 ? 'text-error font-bold' : 'text-on-surface'}">₹ ${appState.liabilities.reduce((sum, l) => sum + l.principal, 0).toLocaleString()}</div>
                        </div>
                        <div class="bg-surface-container/60 backdrop-blur-xl p-6 rounded-2xl shadow-xl border border-outline-variant/10 flex flex-col justify-between">
                            <div class="text-label-caps font-label-caps text-on-surface-variant uppercase mb-4">Monthly EMI Burden</div>
                            <div class="text-headline-md font-mono-data-lg ${appState.liabilities.length > 0 ? 'text-error font-bold' : 'text-on-surface'}">₹ ${Math.round(appState.liabilities.reduce((sum, l) => sum + l.emi, 0)).toLocaleString()}</div>
                        </div>
                    </div>

                    <!-- Split Details Grid -->
                    <div class="w-full max-w-container-max mx-auto px-8 pb-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div class="col-span-8 bg-surface-container-low/80 backdrop-blur-md rounded-2xl p-8 border border-outline-variant/5">
                            <h2 class="text-headline-md font-headline-md text-on-surface mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary-fixed-dim">track_changes</span> Target Vectors
                            </h2>
                            <div class="space-y-6">
                                ${appState.goals.map(g => {
                                    const res = appState.simulation ? appState.simulation.goals.find(gr => gr.name === g.name) : null;
                                    const prob = res ? (res.success_probability * 100).toFixed(0) : "0";
                                    return `
                                        <div>
                                            <div class="flex justify-between items-end mb-2">
                                                <div>
                                                    <div class="text-body-md font-semibold text-on-surface">${g.name} (Age ${g.target_age})</div>
                                                    <div class="text-label-caps text-on-surface-variant uppercase mt-1">₹ ${(g.target_amount/10000000).toFixed(2)} CR Target</div>
                                                </div>
                                                <div class="text-mono-data-lg text-primary-fixed-dim">${prob}%</div>
                                            </div>
                                            <div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
                                                <div class="h-full bg-primary-fixed-dim rounded-full" style="width: ${prob}%"></div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        
                        <!-- Mini Timeline -->
                        <div class="col-span-4 bg-surface-container-low/80 backdrop-blur-md rounded-2xl p-8 border border-outline-variant/5">
                            <h2 class="text-headline-md font-headline-md text-on-surface mb-6 flex items-center gap-2">
                                <span class="material-symbols-outlined text-secondary-fixed-dim">timeline</span> Life Timeline
                            </h2>
                            <div class="border-l-2 border-surface-container-highest pl-4 space-y-6">
                                ${appState.lifeEvents.map(e => `
                                    <div class="relative">

        async function triggerOptimizationRun() {
            const sipVal = Number(document.getElementById('sip-slider').value);
            const retVal = Number(document.getElementById('ret-slider').value);
            
            const resultsDiv = document.getElementById('optimizer-results');
            resultsDiv.innerHTML = `
                <div class="bg-surface-container/30 backdrop-blur-md rounded-xl p-8 border border-outline-variant/10 text-center py-16">
                    <div class="w-12 h-12 border-4 border-primary-fixed-dim border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="font-mono-data-sm text-on-surface-variant">&gt; Running simulation iterations and solver bounds...</p>
                </div>
            `;

            try {
                // Update profile in DB first
                const updatedProfile = { ...appState.profile, monthly_sip: sipVal };
                await fetch(`${API_BASE}/users/${userId}/profile`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedProfile)
                });

                // Update goal in DB
                if (appState.goals[0]) {
                    const updatedGoals = [{ ...appState.goals[0], target_age: retVal }];
                    await fetch(`${API_BASE}/users/${userId}/goals`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedGoals)
                    });
                }

                // Refresh app state
                const userRes = await fetch(`${API_BASE}/users/${userId}`);
                const userData = await userRes.json();
                appState.profile = userData.profile;
                appState.goals = userData.goals;

                // Run Optimization
                const optRes = await fetch(`${API_BASE}/users/${userId}/optimize/${appState.goals[0].id}?target_probability=0.80`, {
                    method: "POST"
                });
                const optData = await optRes.json();

                // Fetch Sensitivity
                const sensRes = await fetch(`${API_BASE}/users/${userId}/goals/${appState.goals[0].id}/sensitivity`);
                const sensData = await sensRes.json();

                // Fetch Multi-Objective Pareto Strategies
                const multiRes = await fetch(`${API_BASE}/users/${userId}/optimize-multi-objective`, {
                    method: "POST"
                });
                const multiData = await multiRes.json();

                renderOptimizationOutput(resultsDiv, optData, sensData, multiData);
            } catch (err) {
                console.error("Optimization failed: ", err);
                resultsDiv.innerHTML = `<div class="p-6 bg-error-container/20 border border-error/50 rounded-xl text-error text-center font-semibold">API call failed. Make sure FastAPI server is running.</div>`;
            }
        }

                                        <input type="number" id="event-prob" step="0.1" min="0" max="1.0" value="1.0" class="w-full bg-surface-container-low rounded-lg border border-outline-variant/20 p-3 text-on-surface focus:outline-none focus:border-primary-fixed-dim">
                                    </div>
                                </div>
                                
                                <button type="submit" class="w-full mt-4 bg-primary-fixed-dim text-on-primary-fixed font-label-caps text-[14px] py-4 rounded-lg uppercase tracking-wider transition-all">
                                    Inject into Digital Twin
                                </button>
                            </form>
                        </div>
                        
                        <!-- Right Panel Timeline lists -->
                        <div class="lg:col-span-8 bg-surface-container-low/80 backdrop-blur-md rounded-2xl p-8 border border-outline-variant/5">
                            <h2 class="text-headline-md font-headline-md text-on-surface mb-6 flex justify-between items-center">
                                Event Timeline
                                <span class="text-mono-data-sm text-[12px] text-on-surface-variant font-normal">Active Events: ${appState.lifeEvents.length}</span>
                            </h2>
                            <div class="space-y-4">
                                ${appState.lifeEvents.map(e => `
                                    <div class="p-4 bg-surface-container-highest/30 rounded-xl border border-outline-variant/10 flex justify-between items-center">
                                        <div>
                                            <span class="px-2 py-0.5 bg-secondary-fixed-dim/20 text-secondary-fixed-dim rounded font-mono-data-sm text-[10px] uppercase">${e.type.replace('_',' ')}</span>
                                            <h4 class="font-semibold text-on-surface mt-2 text-body-md">${e.name} (Age ${e.age})</h4>
                                            <p class="text-mono-data-sm text-on-surface-variant text-[12px] mt-1">
                                                Outflow/Amount: ₹ ${e.amount.toLocaleString()} ${e.duration_years > 0 ? `| Duration: ${e.duration_years} yrs` : ''} | Probability: ${(e.probability*100).toFixed(0)}%
                                            </p>
                                        </div>
                                        <button onclick="deleteLifeEvent(${e.id})" class="text-error hover:bg-error-container/20 p-2 rounded-lg transition-colors">
                                            <span class="material-symbols-outlined">delete</span>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function addLifeEvent(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('event-name').value,
                type: document.getElementById('event-type').value,
                age: Number(document.getElementById('event-age').value),
                amount: Number(document.getElementById('event-amount').value),
                duration_years: Number(document.getElementById('event-duration').value),
                probability: Number(document.getElementById('event-prob').value)
            };

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/life-events`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify([...appState.lifeEvents, payload])
                });
                await refreshData();
            } catch (err) {
                console.error("Adding life event failed: ", err);
            }
        }

        async function deleteLifeEvent(id) {
            const filtered = appState.lifeEvents.filter(e => e.id !== id);
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/life-events`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(filtered)
                });
                await refreshData();
            } catch (err) {
                console.error("Deleting life event failed: ", err);
            }
        }

        // --- ASSET & LIABILITIES PAGE ---
        function renderAssetAllocation(container) {
            const totalWeight = appState.assets.reduce((sum, a) => sum + a.weight, 0);
            
            container.innerHTML = `
                <div class="w-full max-w-container-max mx-auto px-8 mt-6">
                    <h1 class="font-display-lg text-[40px] text-on-surface mb-6">Assets & Liabilities Manager</h1>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <!-- Sliders Panel -->
                        <div class="lg:col-span-6 bg-surface-container-highest/40 rounded-xl p-8 border border-outline-variant/10 space-y-6">
                            <h3 class="font-label-caps text-on-surface-variant uppercase mb-4">Allocation Weights</h3>
                            
                            <div class="space-y-6">
                                ${appState.assets.map(a => `
                                    <div>
                                        <div class="flex justify-between mb-2">
                                            <span class="text-body-md font-semibold">${a.name}</span>
                                            <span id="weight-${a.name}" class="font-mono-data-lg text-primary-fixed-dim">${(a.weight * 100).toFixed(0)}%</span>
                                        </div>
                                        <input type="range" id="slider-${a.name}" min="0" max="1" step="0.05" value="${a.weight}" oninput="updateAssetWeightLabel('${a.name}', this.value)" class="w-full h-1.5 bg-surface-container-low rounded-lg appearance-none cursor-pointer accent-primary-fixed-dim">
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="pt-6 border-t border-outline-variant/10 flex justify-between items-center">
                                <span class="text-body-md">Total Allocation Weight:</span>
                                <span id="weight-total" class="font-mono-data-lg ${Math.abs(totalWeight - 1.0) < 0.01 ? 'text-primary-fixed-dim' : 'text-error font-bold'}">${(totalWeight * 100).toFixed(0)}%</span>
                            </div>

                            <button onclick="saveAssetAllocations()" class="w-full mt-4 bg-primary-fixed-dim text-on-primary-fixed font-label-caps text-[14px] py-4 rounded-lg uppercase tracking-wider transition-all">
                                Update Portfolio Weights
                            </button>
                        </div>

                        <!-- Liabilities / Loans Panel -->
                        <div class="lg:col-span-6 bg-surface-container-highest/40 rounded-xl p-8 border border-outline-variant/10 space-y-6">
                            <h3 class="font-label-caps text-on-surface-variant uppercase mb-4">Liabilities & Outstanding Debt</h3>
                            
                            <!-- Add Loan Form -->
                            <form id="liability-form" onsubmit="addLiability(event)" class="space-y-4 bg-surface-container-low/40 p-4 rounded-xl border border-outline-variant/10">
                                <h4 class="text-body-sm font-bold text-on-surface">Add Loan/Mortgage</h4>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[10px] text-on-surface-variant mb-1 uppercase">Loan Name</label>
                                        <input type="text" id="loan-name" required placeholder="e.g. Home Loan" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-on-surface-variant mb-1 uppercase">Principal (₹)</label>
                                        <input type="number" id="loan-principal" required value="1000000" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-[9px] text-on-surface-variant mb-1 uppercase">Rate (%)</label>
                                        <input type="number" id="loan-rate" step="0.1" required value="8.5" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] text-on-surface-variant mb-1 uppercase">Tenure (Yrs)</label>
                                        <input type="number" id="loan-tenure" required value="15" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] text-on-surface-variant mb-1 uppercase">Start Age</label>
                                        <input type="number" id="loan-start" required value="25" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[9px] text-on-surface-variant mb-1 uppercase">Prepay/Mo. (₹)</label>
                                        <input type="number" id="loan-prepay" value="0" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] text-on-surface-variant mb-1 uppercase">Rate Vol (%)</label>
                                        <input type="number" id="loan-vol" step="0.5" value="0" class="w-full bg-surface-container-highest rounded-lg border border-outline-variant/20 p-2.5 text-on-surface text-[12px] outline-none">
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-primary-fixed-dim text-on-primary-fixed font-label-caps text-[11px] py-3 rounded-lg uppercase tracking-wider transition-all">
                                    Create Liability
                                </button>
                            </form>

                            <!-- Loans list -->
                            <div class="space-y-3">
                                <h4 class="text-body-sm font-bold text-on-surface-variant uppercase">Outstanding Liabilities (${appState.liabilities.length})</h4>
                                ${appState.liabilities.length === 0 ? `
                                    <p class="text-mono-data-sm text-[12px] text-on-surface-variant text-center py-4 bg-surface-container-low rounded-xl border border-dashed border-outline-variant/20">No active liabilities configured.</p>
                                ` : appState.liabilities.map(l => `
                                    <div class="p-3 bg-surface-container-low rounded-xl border border-outline-variant/10 flex justify-between items-center">
                                        <div>
                                            <h4 class="font-semibold text-on-surface text-[14px]">${l.name}</h4>
                                            <p class="text-[11px] text-on-surface-variant font-mono-data-sm mt-0.5">
                                                Principal: ₹ ${l.principal.toLocaleString()} | Rate: ${(l.interest_rate*100).toFixed(1)}% | Monthly EMI: ₹ ${Math.round(l.emi).toLocaleString()}
                                            </p>
                                        </div>
                                        <button onclick="deleteLiability(${l.id})" class="text-error hover:bg-error-container/20 p-1.5 rounded-lg transition-colors">
                                            <span class="material-symbols-outlined text-[20px]">delete</span>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateAssetWeightLabel(name, val) {
            document.getElementById(`weight-${name}`).innerText = `${(Number(val) * 100).toFixed(0)}%`;
            
            // Recalculate total label
            let total = 0;
            appState.assets.forEach(a => {
                const slider = document.getElementById(`slider-${a.name}`);
                if (slider) total += Number(slider.value);
            });

            const totalElem = document.getElementById('weight-total');
            totalElem.innerText = `${(total * 100).toFixed(0)}%`;
            if (Math.abs(total - 1.0) < 0.01) {
                totalElem.className = "font-mono-data-lg text-primary-fixed-dim";
            } else {
                totalElem.className = "font-mono-data-lg text-error font-bold";
            }
        }

        async function saveAssetAllocations() {
            let total = 0;
            const updated = appState.assets.map(a => {
                const slider = document.getElementById(`slider-${a.name}`);
                const weight = Number(slider.value);
                total += weight;
                return { ...a, weight };
            });

            if (Math.abs(total - 1.0) > 0.01) {
                alert(`Error: Portfolio weights must sum to exactly 100%. Current sum: ${(total * 100).toFixed(0)}%`);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/assets`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updated)
                });
                await refreshData();
            } catch (err) {
                console.error("Updating asset allocation failed: ", err);
            }
        }

        async function addLiability(e) {
            e.preventDefault();
            const principal = Number(document.getElementById('loan-principal').value);
            const interest_rate = Number(document.getElementById('loan-rate').value) / 100.0;
            const tenure_years = Number(document.getElementById('loan-tenure').value);
            const r_m = interest_rate / 12.0;
            const N = tenure_years * 12;
            const emi = principal * (r_m * Math.pow(1+r_m, N)) / (Math.pow(1+r_m, N) - 1);

            const payload = {
                name: document.getElementById('loan-name').value,
                principal: principal,
                interest_rate: interest_rate,
                tenure_years: tenure_years,
                start_age: Number(document.getElementById('loan-start').value),
                emi: emi,
                prepayment_monthly: Number(document.getElementById('loan-prepay').value),
                variable_rate_vol: Number(document.getElementById('loan-vol').value) / 100.0
            };

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/liabilities`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify([...appState.liabilities, payload])
                });
                await refreshData();
            } catch (err) {
                console.error("Adding liability failed: ", err);
            }
        }

        async function deleteLiability(id) {
            const filtered = appState.liabilities.filter(l => l.id !== id);
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/liabilities`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(filtered)
                });
                await refreshData();
            } catch (err) {
                console.error("Deleting liability failed: ", err);
            }
        }

        // --- AI COPILOT CHAT PAGE ---
        let chatHistory = [
            { role: "assistant", content: "Hello! I am your FinTwin AI Financial Copilot. Ask me how to achieve your goals early, reallocate assets, or understand risks like drawdowns." }
        ];

        function renderAICopilot(container) {
            container.innerHTML = `
                <div class="flex-1 flex flex-col p-8 max-w-container-max mx-auto w-full min-h-[calc(100vh-64px-48px)]">
                    <div class="flex-1 flex flex-col bg-surface-container/30 backdrop-blur-md rounded-xl border border-outline-variant/10 shadow-lg relative overflow-hidden">
                        <!-- Chat Header -->
                        <div class="p-4 border-b border-outline-variant/10 flex items-center justify-between bg-surface-container-highest/20 z-10">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-primary-fixed/20 flex items-center justify-center relative">
                                    <span class="absolute inset-0 bg-primary-fixed blur-sm opacity-30 rounded-full animate-pulse"></span>
                                    <span class="material-symbols-outlined text-primary-fixed text-[18px]">smart_toy</span>
                                </div>
                                <div>
                                    <h2 class="font-headline-md text-on-surface text-[16px] leading-[20px]">FinTwin AI Copilot</h2>
                                    <p class="font-label-caps text-on-surface-variant text-[10px]">Model: Gemini-2.5-Flash (Active)</p>
                                </div>
                            </div>
                        </div>

                        <!-- Chat Messages Window -->
                        <div class="flex-1 overflow-y-auto p-6 space-y-6 relative h-[350px]" id="chat-history-window">
                            ${chatHistory.map(msg => {
                                const isAI = msg.role === 'assistant';
                                return `
                                    <div class="flex ${isAI ? 'justify-start' : 'justify-end'}">
                                        <div class="${isAI ? 'bg-surface-container-low border border-outline-variant/10' : 'bg-surface-container-highest'} p-4 rounded-2xl rounded-tr-sm max-w-[80%] shadow-md">
                                            <p class="font-body-md text-on-surface">${msg.content.replace(/\n/g, '<br>')}</p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- Chat Input Box -->
                        <div class="p-4 bg-surface-container-highest/30 border-t border-outline-variant/10">
                            <div class="flex items-end gap-2 bg-surface-container p-2 rounded-xl border border-outline-variant/20 focus-within:border-primary-fixed/50 transition-all">
                                <textarea id="copilot-text-input" class="flex-1 bg-transparent border-none focus:ring-0 resize-none font-body-md text-on-surface placeholder-on-surface-variant/50 max-h-32 py-2 outline-none" placeholder="Ask FinTwin... e.g., 'What if I increase my SIP to 20,000?'" rows="1"></textarea>
                                <button onclick="sendChatMessage()" class="p-2 bg-primary-fixed text-on-primary-fixed rounded-lg hover:bg-primary-fixed-dim transition-colors shadow-[0_0_10px_rgba(99,247,255,0.2)]">
                                    <span class="material-symbols-outlined text-[20px]">send</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Auto scroll to bottom
            const win = document.getElementById('chat-history-window');
            if (win) win.scrollTop = win.scrollHeight;
        }

        async function sendChatMessage() {
            const inputElem = document.getElementById('copilot-text-input');
            const text = inputElem.value.trim();
            if (!text) return;

            // Clear input box
            inputElem.value = "";

            // Push User message
            chatHistory.push({ role: "user", content: text });
            renderPage();

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/copilot`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        messages: chatHistory
                    })
                });
                const data = await res.json();
                
                // Push AI response
                chatHistory.push({ role: "assistant", content: data.reply });

                // If copilot extracted actions (e.g. increase SIP / change retirement age), we can alert/prompt to apply them!
                if (data.extracted_action && data.extracted_action.action_type !== 'none') {
                    const action = data.extracted_action;
                    if (confirm(`AI Copilot parsed an action: "${action.action_type.replace('_',' ')}". Do you want to apply these parameter changes to your Digital Twin?`)) {
                        await applyCopilotAction(action);
                    }
                }

                renderPage();
            } catch (err) {
                console.error("Copilot request failed: ", err);
                chatHistory.push({ role: "assistant", content: "⚠️ API failure. AI Copilot is unable to connect to Gemini at the moment." });
                renderPage();
            }
        }

        async function applyCopilotAction(action) {
            try {
                if (action.action_type === 'change_sip') {
                    const updated = { ...appState.profile, monthly_sip: action.parameters.monthly_sip };
                    await fetch(`${API_BASE}/users/${userId}/profile`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updated)
                    });
                } else if (action.action_type === 'change_retirement_age') {
                    const updatedGoals = [{ ...appState.goals[0], target_age: action.parameters.target_age }];
                    await fetch(`${API_BASE}/users/${userId}/goals`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedGoals)
                    });
                } else if (action.action_type === 'add_life_event') {
                    await fetch(`${API_BASE}/users/${userId}/life-events`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify([...appState.lifeEvents, action.parameters])
                    });
                }
                await refreshData();
            } catch (err) {
                console.error("Failed to apply copilot action: ", err);
            }
        }

        // Landing button trigger
        document.getElementById('enter-btn').addEventListener('click', async () => {
            document.getElementById('landing-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.remove('hidden');
            
            // Load and run
            await initApp();
        });
    </script>
</body>
</html>
